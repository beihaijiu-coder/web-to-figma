<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>连接 Web to Figma 客户端</title>
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <link rel="icon" href="../../assets/web-to-figma-icon.png" sizes="128x128" type="image/png" />
    <link rel="stylesheet" href="../../styles.css" />
    <script id="connect-config" type="application/json">{{CONNECT_CONFIG_JSON}}</script>
