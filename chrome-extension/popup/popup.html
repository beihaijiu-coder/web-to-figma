<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web to Figma</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel">
    <h1>Web to Figma</h1>
    <label class="row" for="assetProxyToggle">
      <span>跨域图片代理模式</span>
      <input id="assetProxyToggle" type="checkbox" />
    </label>
    <label class="row" for="proxyConcurrency">
      <span>图片采集并发</span>
      <select id="proxyConcurrency">
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8">8</option>
        <option value="10">10</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="infinite">无限</option>
      </select>
    </label>
    <p class="hint">默认关闭代理。并发仅影响开启代理后的图片抓取速度与稳定性。</p>
    <section class="account">
      <h2>账号连接（开发）</h2>
      <label class="stack" for="apiBaseUrl">
        <span>API 地址</span>
        <input id="apiBaseUrl" type="url" value="http://localhost:8787" />
      </label>
      <label class="stack" for="figmaTarget">
        <span>发送到</span>
        <select id="figmaTarget">
          <option value="">剪贴板手动导入</option>
        </select>
      </label>
      <div class="button-row">
        <button id="connectAccountBtn" class="secondary" type="button">连接账号</button>
        <button id="disconnectAccountBtn" class="ghost" type="button">断开</button>
      </div>
      <p id="cloudStatus" class="status" aria-live="polite"></p>
    </section>
    <button id="captureBtn" type="button">捕获当前网页</button>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
