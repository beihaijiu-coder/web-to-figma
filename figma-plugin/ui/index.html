<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web to Figma</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #2f2f2f;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.18), transparent 38%),
        #2f2f2f;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .dot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
      color: white;
      font-weight: 800;
    }

    .ghost {
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: transparent;
      color: #e5e7eb;
      padding: 8px 12px;
      cursor: pointer;
    }

    .hero {
      margin: 28px auto 8px;
      width: 250px;
      height: 150px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(17, 24, 39, 0.42);
    }

    .illustration {
      width: 160px;
      height: 96px;
      position: relative;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.52);
    }

    .illustration::before,
    .illustration::after {
      content: "";
      position: absolute;
      border-radius: 7px;
      background: #3b8f72;
      left: 40px;
      right: 34px;
    }

    .illustration::before {
      top: 22px;
      height: 24px;
    }

    .illustration::after {
      top: 54px;
      height: 18px;
      left: 58px;
      right: 52px;
    }

    .card-row {
      position: absolute;
      left: 24px;
      right: 20px;
      bottom: 16px;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 14px;
      align-items: end;
    }

    .thumb {
      height: 42px;
      border-radius: 6px;
      background: #a3a3a3;
    }

    .lines {
      display: grid;
      gap: 7px;
    }

    .lines span {
      display: block;
      height: 9px;
      border-radius: 999px;
      background: #4f75a8;
    }

    .lines span:last-child {
      width: 60%;
    }

    .source {
      text-align: center;
      display: grid;
      gap: 8px;
      color: #d1d5db;
      font-weight: 650;
    }

    .source small {
      color: #9ca3af;
      font-weight: 500;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    .account-panel {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.34);
    }

    .account-title {
      margin: 0;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 750;
    }

    .account-status {
      min-height: 18px;
      margin: 0;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.4;
    }

    .cloud-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      padding-top: 2px;
    }

    .cloud-heading {
      display: grid;
      gap: 2px;
    }

    .cloud-heading strong {
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .cloud-heading small {
      color: #8b93a3;
      font-size: 11px;
      line-height: 1.35;
    }

    .refresh {
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      white-space: nowrap;
    }

    .cloud-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      min-height: 78px;
    }

    .cloud-empty {
      grid-column: 1 / -1;
      min-height: 78px;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(148, 163, 184, 0.26);
      border-radius: 13px;
      color: #8b93a3;
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }

    .cloud-task-card {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(129, 140, 248, 0.62);
      border-radius: 12px;
      background: rgba(3, 7, 18, 0.58);
      color: #f8fafc;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      transition: border-color 120ms ease, transform 120ms ease, background 120ms ease;
    }

    .cloud-task-card:hover:not(:disabled) {
      border-color: #93c5fd;
      background: rgba(15, 23, 42, 0.86);
      transform: translateY(-1px);
    }

    .cloud-task-card:disabled {
      opacity: 0.62;
      cursor: default;
    }

    .cloud-preview {
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(168, 85, 247, 0.12)),
        #050816;
      overflow: hidden;
    }

    .cloud-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cloud-preview-fallback {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(59, 130, 246, 0.24);
      color: #93c5fd;
      font-weight: 850;
      font-size: 22px;
    }

    .cloud-meta {
      display: grid;
      gap: 3px;
      padding: 9px 10px 10px;
    }

    .cloud-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 760;
    }

    .cloud-url-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      color: #8b93a3;
      font-size: 11px;
    }

    .cloud-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .field,
    .select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.44);
      color: #f8fafc;
      padding: 11px 12px;
      outline: none;
    }

    .field::placeholder {
      color: #8b93a3;
    }

    .capture-input {
      min-height: 104px;
      resize: vertical;
      line-height: 1.4;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .primary,
    .secondary,
    .danger,
    .neutral {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 750;
    }

    .primary {
      background: #22c55e;
      color: #052e16;
    }

    .secondary {
      background: #3b82f6;
      color: white;
    }

    .danger {
      background: transparent;
      color: #34d399;
    }

    .neutral {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: transparent;
      color: #d1d5db;
    }

    .primary:disabled,
    .secondary:disabled,
    .danger:disabled,
    .neutral:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .steps {
      list-style: none;
      padding: 4px 0 0;
      margin: 0;
      display: grid;
      gap: 16px;
    }

    .step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      color: #9ca3af;
      font-size: 15px;
      font-weight: 650;
      align-items: center;
    }

    .num {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #666;
      color: white;
    }

    .step.active {
      color: #60a5fa;
    }

    .step.active .num {
      background: #3b82f6;
    }

    .bar {
      grid-column: 2;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      display: none;
    }

    .step.active .bar {
      display: block;
    }

    .fill {
      width: 12%;
      height: 100%;
      border-radius: inherit;
      background: #60a5fa;
      transition: width 160ms ease;
    }

    .message {
      min-height: 24px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.45;
    }

    .hidden {
      display: none !important;
    }
  </style>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #16161a;
      --surface: #1e1e23;
      --surface-raised: #27272d;
      --line: #3a3a43;
      --line-strong: #50505c;
      --ink: #f7f7fa;
      --muted: #a7a8b3;
      --accent: #6c63ff;
      --accent-hover: #5c54e8;
      --success: #55d79b;
      --danger: #ff8d86;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
    }

    .shell {
      min-height: 100vh;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .top {
      min-height: 38px;
    }

    .brand {
      gap: 9px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 760;
    }

    .brand-copy {
      display: grid;
      gap: 1px;
    }

    .brand-copy small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .dot {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
      color: transparent;
      overflow: hidden;
    }

    .dot::before,
    .dot::after {
      position: absolute;
      border: 2px solid white;
      border-radius: 4px;
      content: "";
    }

    .dot::before {
      top: 7px;
      left: 6px;
      width: 10px;
      height: 10px;
    }

    .dot::after {
      right: 6px;
      bottom: 7px;
      width: 9px;
      height: 9px;
      border-color: #b9ffdd;
    }

    .ghost {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0;
      color: var(--muted);
      font-size: 18px;
    }

    .ghost:hover {
      border-color: var(--line);
      background: var(--surface-raised);
      color: white;
    }

    .start-copy {
      display: grid;
      gap: 4px;
      padding: 4px 0 2px;
      text-align: left;
    }

    .start-copy #title {
      color: var(--ink);
      font-size: 18px;
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    .start-copy small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
    }

    .form {
      gap: 10px;
    }

    .primary,
    .secondary,
    .danger,
    .neutral {
      min-height: 42px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 720;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover {
      background: var(--accent-hover);
    }

    .primary:active,
    .secondary:active,
    .neutral:active {
      transform: translateY(1px);
    }

    .secondary {
      background: #303038;
      color: var(--ink);
    }

    .secondary:hover {
      background: #393942;
    }

    .neutral {
      border-color: var(--line-strong);
      color: #d4d5dc;
    }

    .neutral:hover {
      background: #2b2b31;
    }

    .danger {
      color: var(--danger);
    }

    .capture-help {
      margin: -2px 2px 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    .local-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 52px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #1a1a1f;
      color: #c9cad2;
      font-size: 10px;
    }

    .local-flow span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .local-flow b {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 6px;
      background: #35323f;
      color: #b9b5ff;
      font-size: 9px;
    }

    .local-flow i {
      color: #6f707b;
      font-style: normal;
    }

    .captures-panel {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .cloud-header {
      align-items: center;
      padding: 0;
    }

    .cloud-heading strong {
      font-size: 13px;
    }

    .cloud-heading small {
      color: var(--muted);
      font-size: 10px;
    }

    .refresh {
      min-height: 30px;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 10px;
    }

    .cloud-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      min-height: 74px;
    }

    .cloud-empty {
      min-height: 74px;
      border-color: var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: #1a1a1e;
      font-size: 11px;
    }

    .cloud-task-card {
      border-color: #555268;
      border-radius: 10px;
      background: #1a1a1f;
    }

    .cloud-task-card:hover:not(:disabled) {
      border-color: #8e88ff;
      background: #24242a;
      transform: translateY(-1px);
    }

    .cloud-preview {
      background: #25252c;
    }

    .cloud-preview-fallback {
      border-radius: 8px;
      background: #37334f;
      color: #bdb9ff;
    }

    .cloud-meta {
      padding: 8px;
    }

    .cloud-title {
      font-size: 11px;
    }

    .cloud-url-row {
      color: var(--muted);
      font-size: 9px;
    }

    .url-import {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
    }

    .url-import .secondary {
      white-space: nowrap;
    }

    .field,
    .select {
      min-height: 40px;
      border-color: var(--line-strong);
      border-radius: 9px;
      padding: 9px 10px;
      background: #1b1b20;
      color: var(--ink);
      font-size: 12px;
    }

    .field::placeholder {
      color: #93949f;
    }

    .field:focus,
    .select:focus,
    button:focus-visible,
    summary:focus-visible {
      outline: 2px solid #9b96ff;
      outline-offset: 2px;
    }

    .options-panel {
      border-top: 1px solid var(--line);
    }

    .options-panel summary {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #d4d5dc;
      font-size: 11px;
      font-weight: 680;
      cursor: pointer;
      list-style: none;
    }

    .options-panel summary::-webkit-details-marker {
      display: none;
    }

    .options-panel summary::after {
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      content: "+";
    }

    .options-panel[open] summary::after {
      content: "−";
    }

    .options-body {
      display: grid;
      gap: 8px;
      padding-bottom: 10px;
    }

    .options-note {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .account-panel {
      gap: 8px;
      padding: 0 0 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .account-title {
      color: #d4d5dc;
      font-size: 11px;
    }

    .account-status {
      color: var(--muted);
      font-size: 10px;
    }

    .developer-subsettings {
      border-top: 1px solid #303038;
    }

    .developer-subsettings summary {
      min-height: 36px;
      color: var(--muted);
      font-weight: 600;
    }

    #progressPanel {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }

    .steps {
      gap: 13px;
    }

    .step {
      color: var(--muted);
      font-size: 12px;
    }

    .step.active {
      color: #a9a4ff;
    }

    .step.active .num {
      background: var(--accent);
    }

    .num {
      width: 24px;
      height: 24px;
      background: #4a4a52;
      font-size: 11px;
    }

    .bar {
      height: 5px;
    }

    .fill {
      background: var(--success);
    }

    .message {
      min-height: 18px;
      margin: 12px 0 4px;
      color: #d4d5dc;
      font-size: 11px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <span class="dot" aria-hidden="true">W</span>
        <span class="brand-copy">Web to Figma<small>网页捕获导入</small></span>
      </div>
      <button id="closeBtn" class="ghost" type="button" aria-label="关闭">×</button>
    </header>

    <section class="source start-copy">
      <div id="title">导入最近捕获</div>
      <small id="subtitle">先在 Chrome 捕获页面，再回到这里一键导入为可编辑图层。</small>
    </section>

    <section class="form" id="startPanel">
      <button id="importClipboardBtn" class="primary" type="button">导入最近捕获</button>
      <p class="capture-help">本地导入无需登录，捕获内容只经过你的剪贴板。</p>
      <textarea id="manualCaptureInput" class="field capture-input hidden" placeholder="在这里粘贴 Chrome 捕获数据"></textarea>

      <div class="local-flow" aria-label="本地导入流程">
        <span><b>1</b> Chrome 捕获</span>
        <i aria-hidden="true">→</i>
        <span><b>2</b> 回到 Figma</span>
        <i aria-hidden="true">→</i>
        <span><b>3</b> 点击导入</span>
      </div>

      <div class="url-import">
        <input id="urlInput" class="field" placeholder="输入网址，在 Chrome 中打开" />
        <button id="openUrlBtn" class="secondary" type="button">打开网页</button>
      </div>

      <details class="options-panel">
        <summary>导入设置</summary>
        <div class="options-body">
          <select id="layoutMode" class="select" aria-label="布局偏好">
            <option value="visual">视觉还原优先</option>
            <option value="editable">可编辑布局优先</option>
          </select>
          <select id="overflowMode" class="select" aria-label="溢出内容处理">
            <option value="preserve">按网页裁剪</option>
            <option value="sidecar" selected>保留网页并附带完整内容（推荐）</option>
            <option value="show">展开全部已采集内容</option>
          </select>
          <input id="fallbackFont" class="field" aria-label="替代字体" placeholder="替代字体，例如 Inter" value="Inter" />
          <p class="options-note">不确定时保留默认设置；字体缺失不会阻断导入。</p>
        </div>
      </details>

      <div class="hidden" aria-hidden="true">
        <button id="importCloudBtn" type="button" disabled>刷新</button>
        <div id="cloudTaskGrid"></div>
        <button id="connectAccountBtn" type="button">连接</button>
        <button id="disconnectAccountBtn" type="button">断开</button>
        <p id="accountStatus"></p>
        <input id="apiBaseUrl" value="https://web-to-figmaapi-production.up.railway.app" />
      </div>
    </section>

    <section id="progressPanel" class="hidden">
      <ol class="steps">
        <li class="step active" data-step="handoff">
          <span class="num">1</span><span>读取捕获数据</span>
          <div class="bar"><div id="progressFill" class="fill"></div></div>
        </li>
        <li class="step" data-step="structure"><span class="num">2</span><span>创建页面结构</span></li>
        <li class="step" data-step="images"><span class="num">3</span><span>导入图片资源</span></li>
        <li class="step" data-step="static"><span class="num">4</span><span>整理可编辑图层</span></li>
      </ol>
      <p id="message" class="message"></p>
      <div class="actions">
        <button id="cancelBtn" class="danger" type="button">取消导入</button>
        <button id="retryBtn" class="secondary hidden" type="button">重试</button>
      </div>
    </section>
  </main>

  <script>
    const startPanel = document.getElementById("startPanel");
    const progressPanel = document.getElementById("progressPanel");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");
    const progressFill = document.getElementById("progressFill");
    const retryBtn = document.getElementById("retryBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const layoutMode = document.getElementById("layoutMode");
    const overflowMode = document.getElementById("overflowMode");
    const fallbackFont = document.getElementById("fallbackFont");
    const urlInput = document.getElementById("urlInput");
    const manualCaptureInput = document.getElementById("manualCaptureInput");
    const apiBaseUrl = document.getElementById("apiBaseUrl");
    const connectAccountBtn = document.getElementById("connectAccountBtn");
    const disconnectAccountBtn = document.getElementById("disconnectAccountBtn");
    const accountStatus = document.getElementById("accountStatus");
    const importCloudBtn = document.getElementById("importCloudBtn");
    const cloudTaskGrid = document.getElementById("cloudTaskGrid");
    let lastPayload = null;
    let deviceAuth = null;
    let accountBusy = false;
    let pendingCloudJobs = [];
    let activeCloudTask = null;
    let storedCloudTask = null;
    const defaultApiBaseUrl = "https://web-to-figmaapi-production.up.railway.app";
    const CLOUD_SYNC_ENABLED = false;
    const legacyLocalApiOrigins = new Set(["http://localhost:8787", "http://127.0.0.1:8787"]);

    function postToMain(message) {
      parent.postMessage({ pluginMessage: message }, "*");
    }

    function setAccountStatus(text) {
      accountStatus.textContent = text || "";
    }

    function setAccountBusy(busy) {
      accountBusy = busy;
      connectAccountBtn.disabled = busy;
      disconnectAccountBtn.disabled = busy;
      importCloudBtn.disabled = busy || !deviceAuth;
      for (const card of cloudTaskGrid.querySelectorAll(".cloud-task-card")) {
        card.disabled = busy;
      }
    }

    function readableUrl(rawValue) {
      const value = String(rawValue || "").trim();
      if (!value) return "未知来源";
      try {
        const url = new URL(value);
        return `${url.hostname}${url.pathname === "/" ? "" : url.pathname}`;
      } catch {
        return value;
      }
    }

    function shortAge(isoValue) {
      const time = Date.parse(isoValue || "");
      if (!Number.isFinite(time)) return "";
      const seconds = Math.max(0, Math.floor((Date.now() - time) / 1000));
      if (seconds < 60) return "刚刚";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} 分钟前`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      return `${days} 天前`;
    }

    function taskTitle(job) {
      return String(job?.sourceTitle || readableUrl(job?.sourceUrl) || "未命名捕获").trim();
    }

    function renderCloudJobs() {
      cloudTaskGrid.replaceChildren();

      if (!deviceAuth) {
        const empty = document.createElement("div");
        empty.className = "cloud-empty";
        empty.textContent = "连接云端同步后，Chrome 捕获会出现在这里。";
        cloudTaskGrid.append(empty);
        return;
      }

      if (!pendingCloudJobs.length) {
        const empty = document.createElement("div");
        empty.className = "cloud-empty";
        empty.textContent = "还没有云端捕获。请先在 Chrome 捕获页面，再点击刷新。";
        cloudTaskGrid.append(empty);
        return;
      }

      for (const job of pendingCloudJobs) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "cloud-task-card";
        card.disabled = accountBusy;
        card.title = `导入 ${taskTitle(job)}`;
        card.onclick = () => importCloudJob(job);

        const preview = document.createElement("div");
        preview.className = "cloud-preview";
        if (job.previewImageDataUrl) {
          const image = document.createElement("img");
          image.src = job.previewImageDataUrl;
          image.alt = "";
          preview.append(image);
        } else {
          const fallback = document.createElement("div");
          fallback.className = "cloud-preview-fallback";
          fallback.textContent = "W";
          preview.append(fallback);
        }

        const meta = document.createElement("div");
        meta.className = "cloud-meta";

        const titleNode = document.createElement("div");
        titleNode.className = "cloud-title";
        titleNode.textContent = taskTitle(job);

        const urlRow = document.createElement("div");
        urlRow.className = "cloud-url-row";

        const urlNode = document.createElement("span");
        urlNode.className = "cloud-url";
        urlNode.textContent = readableUrl(job.sourceUrl);

        const ageNode = document.createElement("span");
        ageNode.textContent = shortAge(job.createdAt);

        urlRow.append(urlNode, ageNode);
        meta.append(titleNode, urlRow);
        card.append(preview, meta);
        cloudTaskGrid.append(card);
      }
    }

    function normalizeApiBaseUrl(rawValue) {
      const url = new URL(String(rawValue || defaultApiBaseUrl).trim());
      if (url.protocol !== "http:" && url.protocol !== "https:") {
        throw new Error("API 地址必须以 http:// 或 https:// 开头。");
      }
      return url.origin;
    }

    function migrateLegacyApiBaseUrl(rawValue) {
      const normalized = normalizeApiBaseUrl(rawValue);
      return legacyLocalApiOrigins.has(normalized) ? defaultApiBaseUrl : normalized;
    }

    async function apiJson(path, options = {}) {
      const baseUrl = normalizeApiBaseUrl(apiBaseUrl.value);
      const headers = { Accept: "application/json" };
      if (options.body !== undefined) headers["Content-Type"] = "application/json";
      if (options.accessToken) headers.Authorization = `Bearer ${options.accessToken}`;

      const response = await fetch(`${baseUrl}${path}`, {
        method: options.method || "GET",
        headers,
        body: options.body === undefined ? undefined : JSON.stringify(options.body),
      });
      const body = await response.json().catch(() => ({}));
      const accepted = options.acceptedStatuses || [200];
      if (!accepted.includes(response.status)) {
        throw new Error(body?.error?.message || `API 请求失败：HTTP ${response.status}`);
      }
      return { status: response.status, body };
    }

    async function apiBytes(path, accessToken) {
      const baseUrl = normalizeApiBaseUrl(apiBaseUrl.value);
      const response = await fetch(`${baseUrl}${path}`, {
        method: "GET",
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body?.error?.message || `API 请求失败：HTTP ${response.status}`);
      }
      return {
        body: new Uint8Array(await response.arrayBuffer()),
        packageSha256: response.headers.get("x-scene-package-sha256") || null,
      };
    }

    function decodeBase64Url(value) {
      const normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - (normalized.length % 4 || 4)) % 4);
      return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
    }

    async function sha256Hex(value) {
      if (!hasSubtleCrypto()) throw new Error("当前环境不支持 Web Crypto。");
      const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", value));
      return Array.from(digest, (byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function hasSubtleCrypto() {
      return Boolean(
        window.crypto &&
          crypto.subtle &&
          typeof crypto.subtle.digest === "function" &&
          typeof crypto.subtle.importKey === "function" &&
          typeof crypto.subtle.decrypt === "function"
      );
    }

    async function decryptScenePackage(encryptedBody, keyValue) {
      const magic = new Uint8Array([0x57, 0x32, 0x46, 0x31]);
      const body = encryptedBody instanceof Uint8Array ? encryptedBody : new Uint8Array(encryptedBody);
      if (body.length < 32 || !magic.every((byte, index) => body[index] === byte)) {
        throw new Error("不支持这个场景包格式。");
      }
      const rawKey = decodeBase64Url(keyValue);
      if (rawKey.length !== 32) throw new Error("场景包密钥无效。");
      const iv = body.slice(4, 16);
      const ciphertext = body.slice(16);
      try {
        const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
        const plaintext = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv, additionalData: magic, tagLength: 128 },
          key,
          ciphertext
        );
        const parsed = JSON.parse(new TextDecoder().decode(plaintext));
        if (parsed?.source !== "web-to-figma" || parsed?.type !== "capture-scene" || !parsed.payload) {
          throw new Error("场景包内容无效。");
        }
        return parsed.payload;
      } catch {
        throw new Error("场景包校验或解密失败。");
      }
    }

    async function downloadCloudTaskPayload(claim, accessToken) {
      if (hasSubtleCrypto()) {
        setAccountStatus("正在下载并校验加密任务…");
        const downloaded = await apiBytes(claim.body.download.url, accessToken);
        const expectedSha256 = claim.body.packageSha256 || downloaded.packageSha256;
        if (expectedSha256 && (await sha256Hex(downloaded.body)) !== expectedSha256) {
          throw new Error("任务包校验值不匹配。");
        }
        return decryptScenePackage(downloaded.body, claim.body.encryption.key);
      }

      const downloadJson = claim.body.downloadJson?.url || claim.body.download?.url?.replace(/\/package$/, "/package-json");
      if (!downloadJson) throw new Error("缺少任务下载地址。");
      setAccountStatus("正在通过兼容模式下载任务…");
      const result = await apiJson(downloadJson, { accessToken });
      if (result.body?.payload === undefined) throw new Error("任务包内容无效。");
      return result.body.payload;
    }

    function tokenExpiry(seconds) {
      return Date.now() + Math.max(0, Number(seconds || 0)) * 1000;
    }

    function saveDeviceAuth(tokens) {
      deviceAuth = {
        apiBaseUrl: normalizeApiBaseUrl(apiBaseUrl.value),
        accessToken: tokens.accessToken,
        refreshToken: tokens.refreshToken,
        accessTokenExpiresAt: tokenExpiry(tokens.expiresIn),
        refreshTokenExpiresAt: tokenExpiry(tokens.refreshExpiresIn),
      };
      postToMain({ type: "save-device-auth", ...deviceAuth });
      importCloudBtn.disabled = false;
      renderCloudJobs();
    }

    async function refreshDeviceAuth(auth) {
      if (!auth?.refreshToken || Number(auth.refreshTokenExpiresAt || 0) <= Date.now()) return false;
      const migratedApiBaseUrl = migrateLegacyApiBaseUrl(auth.apiBaseUrl || apiBaseUrl.value);
      apiBaseUrl.value = migratedApiBaseUrl;
      deviceAuth = { ...auth, apiBaseUrl: migratedApiBaseUrl };
      if (migratedApiBaseUrl !== auth.apiBaseUrl) {
        postToMain({ type: "save-device-auth", ...deviceAuth });
      }
      if (auth.accessToken && Number(auth.accessTokenExpiresAt || 0) > Date.now() + 30_000) {
        importCloudBtn.disabled = false;
        return true;
      }
      const result = await apiJson("/v1/tokens/refresh", {
        method: "POST",
        body: { refreshToken: auth.refreshToken },
      });
      saveDeviceAuth(result.body);
      return true;
    }

    async function ensureDeviceAccessToken() {
      if (deviceAuth?.accessToken && Number(deviceAuth.accessTokenExpiresAt || 0) > Date.now() + 30_000) {
        return deviceAuth.accessToken;
      }
      if (!deviceAuth && storedCloudTask) throw new Error("请重新连接云端同步，以完成当前任务。");
      const refreshed = await refreshDeviceAuth(deviceAuth);
      if (!refreshed || !deviceAuth?.accessToken) throw new Error("连接已过期，请重新连接。");
      return deviceAuth.accessToken;
    }

    async function refreshPendingCloudJobs() {
      if (!deviceAuth) {
        pendingCloudJobs = [];
        importCloudBtn.disabled = true;
        importCloudBtn.textContent = "刷新";
        renderCloudJobs();
        return [];
      }
      const accessToken = await ensureDeviceAccessToken();
      const result = await apiJson("/v1/conversion-jobs/pending", { accessToken });
      pendingCloudJobs = Array.isArray(result.body?.jobs) ? result.body.jobs : [];
      importCloudBtn.disabled = false;
      importCloudBtn.textContent = "刷新";
      renderCloudJobs();
      setAccountStatus(
        pendingCloudJobs.length
          ? `${pendingCloudJobs.length} 个捕获已就绪，点击卡片即可导入。`
          : "已连接，暂无等待中的云端任务。"
      );
      return pendingCloudJobs;
    }

    async function reportCloudTask(taskId, outcome) {
      const accessToken = await ensureDeviceAccessToken();
      const endpoint = outcome === "imported" ? "imported" : outcome === "cancelled" ? "cancelled" : "failed";
      await apiJson(`/v1/conversion-jobs/${encodeURIComponent(taskId)}/${endpoint}`, {
        method: "POST",
        accessToken,
      });
      activeCloudTask = null;
      storedCloudTask = null;
      postToMain({ type: "clear-cloud-task" });
      await refreshPendingCloudJobs();
    }

    async function recoverStoredCloudTask() {
      if (!storedCloudTask?.taskId || !deviceAuth) return;
      const status = storedCloudTask.status;
      if (status === "claimed") {
        setAccountStatus("上次中断的云端任务可以重试。");
        await refreshPendingCloudJobs();
        return;
      }
      if (status === "importing") {
        setAccountStatus("正在清理上次中断的云端导入…");
        postToMain({ type: "cleanup-stale-cloud-task", taskId: storedCloudTask.taskId });
        return;
      }
      if (status === "imported_pending") await reportCloudTask(storedCloudTask.taskId, "imported");
      if (status === "cancelled_pending") await reportCloudTask(storedCloudTask.taskId, "cancelled");
      if (status === "failed_pending") await reportCloudTask(storedCloudTask.taskId, "failed");
    }

    async function pollDeviceConnection(deviceCode, intervalSeconds, expiresInSeconds) {
      const expiresAt = Date.now() + Math.max(30, Number(expiresInSeconds || 600)) * 1000;
      let intervalMs = Math.max(3, Number(intervalSeconds || 5)) * 1000;

      while (Date.now() < expiresAt) {
        await new Promise((resolve) => setTimeout(resolve, intervalMs));
        const result = await apiJson("/v1/device-connections/token", {
          method: "POST",
          body: { deviceCode },
          acceptedStatuses: [200, 202, 429],
        });
        if (result.status === 200) {
          saveDeviceAuth(result.body);
          return true;
        }
        if (result.body?.interval) intervalMs = Math.max(3, Number(result.body.interval)) * 1000;
      }

      throw new Error("连接请求已过期。");
    }

    function fallbackFontName() {
      return { family: fallbackFont.value.trim() || "Inter", style: "Regular" };
    }

    function setProgress(step, percent, text) {
      for (const node of document.querySelectorAll(".step")) {
        node.classList.toggle("active", node.dataset.step === step);
      }
      progressFill.style.width = `${Math.max(8, Math.min(100, percent))}%`;
      message.textContent = text || "";
    }

    function showProgress(payload) {
      lastPayload = payload;
      startPanel.classList.add("hidden");
      progressPanel.classList.remove("hidden");
      retryBtn.classList.add("hidden");
      cancelBtn.classList.remove("hidden");
      title.textContent = "正在导入页面";
      subtitle.textContent = payload?.source?.url || "剪贴板捕获";
      setProgress("handoff", 18, "正在准备导入…");
    }

    function showStart(text) {
      startPanel.classList.remove("hidden");
      progressPanel.classList.add("hidden");
      title.textContent = "导入最近捕获";
      subtitle.textContent = text || "在 Chrome 捕获页面，然后在这里从剪贴板导入。";
    }

    function parseClipboardCapture(text) {
      const trimmed = String(text || "").trim();
      if (/^<svg[\s>]/i.test(trimmed)) {
        throw new Error("剪贴板中是 SVG。请直接粘贴到 Figma 画布，或在 Chrome 中选择“复制结构数据”。");
      }

      if (/^</.test(trimmed)) {
        throw new Error("剪贴板中是网页标记，不是 Web to Figma 捕获数据。");
      }

      const parsed = JSON.parse(text);
      if (parsed?.source === "web-to-figma" && parsed?.type === "capture-scene") {
        return parsed.payload;
      }
      if (parsed?.version === 1 && parsed?.root) return parsed;
      throw new Error("剪贴板中没有 Web to Figma 捕获数据。");
    }

    function importPayload(payload, cloudTaskId = null) {
      showProgress(payload);
      parent.postMessage(
        {
          pluginMessage: {
            type: "import-capture",
            payload,
            layoutMode: layoutMode.value,
            overflowMode: overflowMode.value,
            fallbackFont: fallbackFontName(),
            cloudTaskId,
          },
        },
        "*"
      );
    }

    function showManualPaste(messageText) {
      manualCaptureInput.classList.remove("hidden");
      manualCaptureInput.focus();
      title.textContent = "粘贴捕获数据";
      subtitle.textContent = messageText || "请在这里粘贴 Chrome 捕获数据。";
    }

    function tryImportManualCapture() {
      const text = manualCaptureInput.value.trim();
      if (!text) return false;

      try {
        importPayload(parseClipboardCapture(text));
        manualCaptureInput.value = "";
        manualCaptureInput.classList.add("hidden");
        return true;
      } catch (error) {
        title.textContent = "导入失败";
        subtitle.textContent = error.message || String(error);
        return false;
      }
    }

    function tryImportCaptureText(text) {
      const trimmed = String(text || "").trim();
      if (!trimmed) return false;

      try {
        importPayload(parseClipboardCapture(trimmed));
        manualCaptureInput.value = "";
        manualCaptureInput.classList.add("hidden");
        return true;
      } catch (error) {
        title.textContent = "导入失败";
        subtitle.textContent = error.message || String(error);
        return false;
      }
    }

    async function readClipboardText() {
      if (!navigator.clipboard || typeof navigator.clipboard.readText !== "function") {
        throw new Error("Figma 无法直接读取剪贴板。");
      }

      return navigator.clipboard.readText();
    }

    connectAccountBtn.onclick = async () => {
      if (accountBusy) return;
      setAccountBusy(true);
      setAccountStatus("正在创建连接请求…");
      try {
        apiBaseUrl.value = normalizeApiBaseUrl(apiBaseUrl.value);
        const result = await apiJson("/v1/device-connections", {
          method: "POST",
          body: {
            clientType: "figma_plugin",
            requestedClientName: "Figma plugin",
          },
          acceptedStatuses: [201],
        });
        postToMain({ type: "open-external", url: result.body.verificationUriComplete });
        setAccountStatus(`浏览器已打开，请确认验证码 ${result.body.userCode}。`);
        await pollDeviceConnection(
          result.body.deviceCode,
          result.body.interval,
          result.body.expiresIn
        );
        await refreshPendingCloudJobs();
      } catch (error) {
        setAccountStatus(error.message || String(error));
      } finally {
        setAccountBusy(false);
      }
    };

    disconnectAccountBtn.onclick = async () => {
      if (activeCloudTask) {
        setAccountStatus("请先完成或取消当前云端导入，再断开连接。");
        return;
      }
      setAccountBusy(true);
      try {
        if (deviceAuth) {
          const accessToken = await ensureDeviceAccessToken();
          await apiJson("/v1/device/me", { method: "DELETE", accessToken });
        }
        deviceAuth = null;
        pendingCloudJobs = [];
        postToMain({ type: "clear-device-auth" });
        setAccountStatus("已断开连接，并撤销本 Figma 插件的授权。");
        importCloudBtn.disabled = true;
        renderCloudJobs();
      } catch (error) {
        setAccountStatus(error.message || String(error));
      } finally {
        setAccountBusy(false);
      }
    };

    async function importCloudJob(job) {
      if (accountBusy || activeCloudTask) return;
      setAccountBusy(true);
      let claimedTaskId = null;
      let handedToImporter = false;
      try {
        if (!job) {
          setAccountStatus("已连接，暂无等待中的云端任务。");
          return;
        }

        const accessToken = await ensureDeviceAccessToken();
        setAccountStatus("正在领取加密任务…");
        const claim = await apiJson(`/v1/conversion-jobs/${encodeURIComponent(job.id)}/claim`, {
          method: "POST",
          accessToken,
        });
        claimedTaskId = claim.body.taskId;
        if (claim.body?.encryption?.algorithm !== "A256GCM" || !claim.body?.encryption?.key) {
          throw new Error("缺少任务加密信息。");
        }

        const payload = await downloadCloudTaskPayload(claim, accessToken);
        activeCloudTask = { taskId: claimedTaskId };
        storedCloudTask = { taskId: claimedTaskId, status: "claimed" };
        postToMain({ type: "save-cloud-task", task: storedCloudTask });
        handedToImporter = true;
        importPayload(payload, claimedTaskId);
      } catch (error) {
        if (claimedTaskId && handedToImporter) {
          try {
            activeCloudTask = { taskId: claimedTaskId };
            await reportCloudTask(claimedTaskId, "failed");
          } catch {
            storedCloudTask = { taskId: claimedTaskId, status: "failed_pending" };
          }
        } else if (claimedTaskId) {
          storedCloudTask = { taskId: claimedTaskId, status: "claimed" };
          postToMain({ type: "save-cloud-task", task: storedCloudTask });
          await refreshPendingCloudJobs().catch(() => undefined);
        }
        title.textContent = "导入失败";
        subtitle.textContent = error.message || String(error);
        setAccountStatus(error.message || String(error));
      } finally {
        setAccountBusy(false);
      }
    }

    importCloudBtn.onclick = async () => {
      if (accountBusy || activeCloudTask) return;
      setAccountBusy(true);
      try {
        await refreshPendingCloudJobs();
      } catch (error) {
        setAccountStatus(error.message || String(error));
      } finally {
        setAccountBusy(false);
      }
    };

    document.getElementById("importClipboardBtn").onclick = async () => {
      if (tryImportManualCapture()) return;

      try {
        const text = await readClipboardText();
        tryImportCaptureText(text);
      } catch (error) {
        if (!navigator.clipboard || typeof navigator.clipboard.readText !== "function") {
          showManualPaste("Figma 无法直接读取剪贴板，请在这里粘贴捕获数据。");
          return;
        }

        title.textContent = "导入失败";
        subtitle.textContent = error.message || String(error);
      }
    };

    manualCaptureInput.addEventListener("paste", () => {
      setTimeout(() => {
        tryImportManualCapture();
      }, 0);
    });

    window.addEventListener("paste", (event) => {
      if (!startPanel || startPanel.classList.contains("hidden")) return;

      const text = event.clipboardData && event.clipboardData.getData("text/plain");
      if (!text) return;

      if (tryImportCaptureText(text)) {
        event.preventDefault();
      }
    });

    document.getElementById("openUrlBtn").onclick = async () => {
      try {
        const url = new URL(urlInput.value.trim());
        await navigator.clipboard.writeText(
          JSON.stringify({
            source: "web-to-figma",
            type: "url-capture-request",
            url: url.href,
            layoutMode: layoutMode.value,
          })
        );
        window.open(url.href, "_blank");
        title.textContent = "Chrome 已打开";
        subtitle.textContent = "使用 Chrome 扩展捕获该页面，然后回到这里导入剪贴板。";
      } catch {
        title.textContent = "网址无效";
        subtitle.textContent = "请输入完整的 http:// 或 https:// 网址。";
      }
    };

    cancelBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: "cancel-import" } }, "*");
      setProgress("static", 100, "正在取消…");
    };

    retryBtn.onclick = () => {
      if (lastPayload) importPayload(lastPayload, activeCloudTask?.taskId || null);
    };

    document.getElementById("closeBtn").onclick = () => {
      parent.postMessage({ pluginMessage: { type: "close" } }, "*");
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "device-auth") {
        if (!msg.auth) {
          setAccountStatus("未连接云端同步。");
          pendingCloudJobs = [];
          renderCloudJobs();
          return;
        }

        deviceAuth = msg.auth;
        refreshDeviceAuth(msg.auth)
          .then(async (connected) => {
            if (!connected) {
              setAccountStatus("连接已过期，请重新连接。");
              return;
            }
            await recoverStoredCloudTask();
            if (!storedCloudTask) await refreshPendingCloudJobs();
          })
          .catch((error) => {
            deviceAuth = null;
            postToMain({ type: "clear-device-auth" });
            setAccountStatus(error.message || String(error));
          });
        return;
      }

      if (msg.type === "device-auth-cleared") {
        setAccountStatus("未连接云端同步。");
        pendingCloudJobs = [];
        importCloudBtn.disabled = true;
        renderCloudJobs();
        return;
      }

      if (msg.type === "cloud-task") {
        storedCloudTask = msg.task || null;
        recoverStoredCloudTask().catch((error) => setAccountStatus(error.message || String(error)));
        return;
      }

      if (msg.type === "cloud-task-cleaned") {
        storedCloudTask = { taskId: msg.taskId, status: "failed_pending" };
        reportCloudTask(msg.taskId, "failed").catch((error) => setAccountStatus(error.message || String(error)));
        return;
      }

      if (msg.type === "import-progress") {
        if (msg.stage === "import-started") setProgress("structure", 34, "正在导入页面结构…");
        if (msg.stage === "creating-nodes") setProgress("images", 66, "正在导入图片资源…");
        if (msg.stage === "completed") setProgress("static", 100, "");
      }

      if (msg.type === "import-complete") {
        setProgress("static", 100, "");
        if (msg.cloudTaskId) {
          reportCloudTask(msg.cloudTaskId, "imported")
            .then(() => setAccountStatus("云端任务已完成。"))
            .catch((error) => setAccountStatus(`导入已完成，任务状态将自动重试：${error.message || error}`));
        }
        setTimeout(() => showStart("导入完成，结果已在 Figma 画布中选中。"), 450);
      }

      if (msg.type === "import-cancelled") {
        if (msg.cloudTaskId) {
          reportCloudTask(msg.cloudTaskId, "cancelled").catch((error) =>
            setAccountStatus(`已取消，任务清理将自动重试：${error.message || error}`)
          );
        }
        showStart("已取消，未完成的图层已从 Figma 中移除。");
      }

      if (msg.type === "import-failed") {
        if (msg.cloudTaskId) activeCloudTask = { taskId: msg.cloudTaskId };
        cancelBtn.classList.add("hidden");
        retryBtn.classList.remove("hidden");
        title.textContent = "导入失败";
        subtitle.textContent = msg.message || "请重试。";
        message.textContent = "可重试";
      }
    };

    if (CLOUD_SYNC_ENABLED) {
      setAccountStatus("正在检查连接状态…");
      renderCloudJobs();
      postToMain({ type: "get-device-auth" });
      postToMain({ type: "get-cloud-task" });
    }
  </script>
</body>
</html>
